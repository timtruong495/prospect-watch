name: World Juniors data test
# One-time test, run by hand from the Actions tab. Delete once the data source is chosen.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: update-data
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test World Juniors data sources
        run: python wjc_probe.py
      - name: Save the results
        run: |
          git config user.name "prospect-watch-bot"
          git config user.email "prospect-watch-bot@users.noreply.github.com"
          git add wjc_probe.json
          git diff --cached --quiet || git commit -m "World Juniors data test results"
          git push
